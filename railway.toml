[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.tokenizer", "php84Extensions.pdo", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.gd", "composer", "nodejs_20"]

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
